[project]
name = "vn30-factor-optimizer"
version = "0.1.0"
description = "VN30 Factor Optimizer Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg2-binary",
    "pandas",
    "numpy",
    "pyarrow",
    "statsmodels",
    "scipy",
    "scikit-learn",
    "openpyxl",
    "requests",
    "tenacity",
    "typer",
    "loguru",
    "pandera",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "black",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['app']

